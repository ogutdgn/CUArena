name: figma-delivery-final

services:
  figma-env:
    build:
      context: ./runtime
      dockerfile: figma-env/Dockerfile
    image: figma-delivery-final-figma-env:latest
    ports:
      - "${MOCK_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEVLOG_DIR: /workspace/figma-env/dev-logs
      TASKS_DIR: /workspace/package
    volumes:
      - ./runtime/output/environment-devlog:/workspace/figma-env/dev-logs
      - ./:/workspace/package:ro
    networks:
      default:
        aliases:
          - mock

  verifier:
    build:
      context: ./runtime/verifier
      dockerfile: Dockerfile
    image: figma-delivery-final-verifier:latest
    depends_on:
      figma-env:
        condition: service_healthy
    working_dir: /workspace
    environment:
      FIGMA_DELIVERY_DIR: /workspace/package
      FIGMA_OUTPUT_DIR: /workspace/output
      FIGMA_ENV_DEVLOG_DIR: /workspace/output/environment-devlog
      FIGMA_MOCK_DEVLOG_DIR: /workspace/output/environment-devlog
    volumes:
      - ./runtime/output:/workspace/output
      - ./:/workspace/package:ro
